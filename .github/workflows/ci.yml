name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Package.swift declares swift-tools-version 6.3, which needs Xcode 26+.
      # 'latest-stable' picks the newest Xcode on the runner image.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swift63-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-swift63-

      - name: Build (debug)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test coverage-gate path handling
        run: python3 -B -m unittest discover -s Scripts -p 'test_*.py'

      - name: Test with linguistic-front-end coverage gate
        run: |
          swift test --enable-code-coverage
          COVERAGE_JSON="$(swift test --show-codecov-path)"
          test -s "$COVERAGE_JSON"
          python3 Scripts/check_frontend_coverage.py "$COVERAGE_JSON" 85

      - name: Build (release)
        run: swift build -c release

  platforms:
    name: Build ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: 'generic/platform=iOS'
          - name: watchOS
            destination: 'generic/platform=watchOS'
          - name: tvOS
            destination: 'generic/platform=tvOS'
          - name: visionOS
            destination: 'generic/platform=visionOS'
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build for ${{ matrix.name }}
        run: |
          xcodebuild build \
            -scheme Choir \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO
